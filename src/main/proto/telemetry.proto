
syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.nba.engine.grpc";
option java_outer_classname = "TelemetryProto";

package telemetry;

service RaftTelemetryService {
  // Raft Consensus RPCs
  rpc RequestVote (VoteRequest) returns (VoteResponse);
  rpc AppendEntries (AppendRequest) returns (AppendResponse);

  // Client Ingestion & Query RPCs
  rpc IngestPlayEvent (PlayEvent) returns (IngestAck);
  rpc GetPlayerStats (PlayerQuery) returns (PlayerBoxScore);
  rpc Ping(PingRequest) returns (PingResponse);
}

// NBA event types
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  POINTS_SCORED = 1;
  REBOUND = 2;
  ASSIST = 3;
}

// A client-submitted NBA event
message PlayEvent {
  string event_id = 1;
  string game_id = 2;
  int32 player_id = 3;
  EventType event_type = 4;
  int32 value = 5;
  int64 timestamp_ms = 6;
}

// Raft replicated log entry
message LogEntry {
  int64 term = 1;
  int64 index = 2;
  PlayEvent event = 3;
}

// Raft leader election
message VoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message VoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

// Raft log replication
message AppendRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendResponse {
  int64 term = 1;
  bool success = 2;

  // Helps the leader reconcile conflicting logs efficiently
  int64 conflict_index = 3;
  int64 conflict_term = 4;
}

// Client ingestion acknowledgment
message IngestAck {
  bool accepted = 1;
  string leader_hint = 2;
  int64 log_index = 3;
}

// Client query
message PlayerQuery {
  string game_id = 1;
  int32 player_id = 2;
}

// Player box score for a specific game
message PlayerBoxScore {
  string game_id = 1;
  int32 player_id = 2;
  int32 points = 3;
  int32 rebounds = 4;
  int32 assists = 5;
}

message PingRequest {
  string sender_id = 1;
}

message PingResponse {
  string receiver_id = 1;
  bool success = 2;
}